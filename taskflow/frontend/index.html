<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow — Project &amp; Task Manager</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>TaskFlow</h1>
    <p class="subtitle">Project &amp; task management, made simple</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit">Log In</button>
      <p class="error" id="loginError"></p>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input type="text" id="registerName" placeholder="Full Name" required />
      <input type="email" id="registerEmail" placeholder="Email" required />
      <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required />
      <button type="submit">Create Account</button>
      <p class="error" id="registerError"></p>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <nav class="navbar">
    <div class="nav-brand">TaskFlow</div>
    <div class="nav-user">
      <span id="userNameLabel"></span>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <h3>My Projects</h3>
      <ul id="projectList" class="project-list"></ul>
      <button id="newProjectBtn" class="btn-secondary">+ New Project</button>
    </aside>

    <main class="main-content">
      <div id="noProjectSelected" class="empty-state">
        <p>Select a project or create a new one to get started.</p>
      </div>

      <div id="projectView" class="hidden">
        <div class="project-header">
          <h2 id="projectTitle"></h2>
          <button id="newTaskBtn" class="btn-primary">+ Add Task</button>
        </div>
        <p id="projectDescription" class="project-desc"></p>

        <div class="board">
          <div class="board-column" data-status="TODO">
            <h4>To Do</h4>
            <div class="task-list" id="col-TODO"></div>
          </div>
          <div class="board-column" data-status="IN_PROGRESS">
            <h4>In Progress</h4>
            <div class="task-list" id="col-IN_PROGRESS"></div>
          </div>
          <div class="board-column" data-status="DONE">
            <h4>Done</h4>
            <div class="task-list" id="col-DONE"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- New Project Modal -->
<div id="projectModal" class="modal hidden">
  <div class="modal-content">
    <h3>New Project</h3>
    <form id="projectForm">
      <input type="text" id="newProjectName" placeholder="Project name" required />
      <textarea id="newProjectDesc" placeholder="Description (optional)"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelProjectBtn">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- New Task Modal -->
<div id="taskModal" class="modal hidden">
  <div class="modal-content">
    <h3>New Task</h3>
    <form id="taskForm">
      <input type="text" id="newTaskTitle" placeholder="Task title" required />
      <textarea id="newTaskDesc" placeholder="Description (optional)"></textarea>
      <label>Priority</label>
      <select id="newTaskPriority">
        <option value="LOW">Low</option>
        <option value="MEDIUM" selected>Medium</option>
        <option value="HIGH">High</option>
      </select>
      <label>Due Date</label>
      <input type="date" id="newTaskDueDate" />
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelTaskBtn">Cancel</button>
        <button type="submit" class="btn-primary">Add Task</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
