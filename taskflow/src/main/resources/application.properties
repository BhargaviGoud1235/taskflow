spring.application.name=taskflow
server.port=8080

# MySQL Database - update these with your local MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT - IMPORTANT: replace this secret with your own long random string before deploying anywhere real
jwt.secret=ChangeThisToALongRandomSecretKeyAtLeast256BitsForHS256Algorithm123456
jwt.expiration-ms=86400000

spring.jackson.date-format=yyyy-MM-dd
